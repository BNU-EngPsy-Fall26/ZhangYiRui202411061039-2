<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>眼动环境自检 · Attention Lab</title>
<style>
  body { margin: 0; padding: 24px; font: 14px/1.7 -apple-system, "Segoe UI", "Microsoft YaHei", sans-serif; background: #eef1f6; color: #1a2233; }
  .box { max-width: 820px; margin: 0 auto; background: #fff; border-radius: 14px; padding: 24px 28px; box-shadow: 0 4px 20px rgba(13,43,92,.08); }
  h1 { font-size: 20px; margin: 0 0 6px; color: #0D2B5C; }
  p.lead { color: #5b6475; font-size: 13px; margin: 0 0 16px; }
  .row { display: flex; gap: 10px; flex-wrap: wrap; margin: 14px 0; }
  button { font: inherit; padding: 9px 16px; border-radius: 9px; border: 1px solid #cfd6e2; background: #fff; cursor: pointer; }
  button.primary { background: #0D2B5C; border-color: #0D2B5C; color: #fff; }
  button:disabled { opacity: .5; cursor: default; }
  pre { background: #0f172a; color: #d8e2f0; border-radius: 10px; padding: 14px 16px; font-size: 12.5px; line-height: 1.6; overflow: auto; margin: 12px 0 0; min-height: 120px; }
  .ok { color: #1D9E75; } .bad { color: #c62828; } .warn { color: #b26a00; }
  video { width: 240px; border-radius: 10px; background: #000; display: none; margin-top: 8px; }
  .note { background: #fffbeb; border-left: 4px solid #C8A44A; padding: 10px 14px; border-radius: 0 8px 8px 0; font-size: 13px; color: #6b5a2a; margin-top: 16px; }
</style>
</head>
<body>
<div class="box">
  <h1>眼动环境自检</h1>
  <p class="lead">在<b>要跑实验的那台电脑、那个浏览器</b>里打开本页。三项全绿，说明摄像头、模型文件、WebGazer 都就绪。</p>

  <div class="row">
    <button class="primary" id="b1">1 · 检查运行环境</button>
    <button id="b2">2 · 检查模型文件（约 18 MB）</button>
    <button id="b3">3 · 打开摄像头</button>
    <button id="b4">4 · 加载 WebGazer</button>
  </div>
  <video id="v" playsinline muted></video>
  <pre id="log">点上面的按钮，结果会按顺序打印在这里。</pre>

  <div class="note">
    结论怎么看：<b>1</b> 必须显示「安全上下文 = 是」，否则摄像头一定不可用（本页需用 https 或 localhost 打开）；
    <b>2</b> 若某个文件 404，说明仓库里缺文件或路径不对；
    <b>3</b> 出现画面即摄像头可用；
    <b>4</b> 打印出 webgazer 对象即脚本加载成功。
  </div>
</div>

<script>
const log = (msg, cls) => {
  const el = document.getElementById('log');
  el.innerHTML += '\n' + (cls ? '<span class="' + cls + '">' + msg + '</span>' : msg);
  el.scrollTop = el.scrollHeight;
};
document.getElementById('log').textContent = '';

const ASSETS = [
  '../vendor/webgazer/webgazer.js',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_packed_assets_loader.js',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_packed_assets.data',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_simd_wasm_bin.js',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_simd_wasm_bin.wasm',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_wasm_bin.js',
  '../vendor/webgazer/mediapipe/face_mesh/face_mesh_solution_wasm_bin.wasm',
];

document.getElementById('b1').onclick = () => {
  log('— 运行环境 —');
  log('页面地址：' + location.href);
  log('协议：' + location.protocol);
  log('安全上下文：' + (isSecureContext ? '是' : '否（摄像头会失败）'), isSecureContext ? 'ok' : 'bad');
  log('mediaDevices：' + (navigator.mediaDevices ? '存在' : '不存在'), navigator.mediaDevices ? 'ok' : 'bad');
  log('浏览器：' + navigator.userAgent.replace(/^.*?(Chrome\/[\d.]+|Edg\/[\d.]+|Firefox\/[\d.]+|Safari\/[\d.]+).*$/, '$1'));
};

document.getElementById('b2').onclick = async () => {
  log('— 模型文件 —');
  for (const u of ASSETS) {
    try {
      const r = await fetch(u, { method: 'GET', cache: 'no-store' });
      const b = await r.arrayBuffer();
      const okSize = b.byteLength > 1000;
      log((r.ok && okSize ? '✓ ' : '✗ ') + u.split('/').pop() + '  ' + r.status + '  ' + (b.byteLength / 1048576).toFixed(2) + ' MB  ' + (r.headers.get('content-type') || ''),
        r.ok && okSize ? 'ok' : 'bad');
    } catch (e) {
      log('✗ ' + u.split('/').pop() + '  ' + e.name + ': ' + e.message, 'bad');
    }
  }
};

document.getElementById('b3').onclick = async () => {
  log('— 摄像头 —');
  try {
    const s = await navigator.mediaDevices.getUserMedia({ video: { width: 640, height: 480 } });
    const v = document.getElementById('v');
    v.srcObject = s; v.style.display = 'block'; await v.play();
    const t = s.getVideoTracks()[0].getSettings();
    log('✓ 摄像头可用：' + t.width + '×' + t.height + '　' + (t.deviceId ? '' : '') + t.label, 'ok');
  } catch (e) {
    log('✗ ' + e.name + ': ' + e.message, 'bad');
  }
};

document.getElementById('b4').onclick = async () => {
  log('— WebGazer —');
  try {
    await new Promise((res, rej) => {
      if (window.webgazer) return res();
      const s = document.createElement('script');
      s.src = '../vendor/webgazer/webgazer.js';
      s.onload = res; s.onerror = () => rej(new Error('脚本加载失败'));
      document.head.appendChild(s);
    });
    const wg = window.webgazer;
    log('✓ webgazer 已加载：' + typeof wg, 'ok');
    log('  faceMeshSolutionPath 将设为：' + new URL('../vendor/webgazer/mediapipe/face_mesh', document.baseURI).href);
    log('  可用方法：' + ['begin', 'setGazeListener', 'setRegression', 'addMouseEventListeners'].filter((k) => typeof wg[k] === 'function').join(', '));
  } catch (e) {
    log('✗ ' + e.message, 'bad');
  }
};
</script>
</body>
</html>
