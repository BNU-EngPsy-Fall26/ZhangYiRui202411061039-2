<!DOCTYPE html>
<html lang="zh-CN" data-no-auto-results>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>注意与空间认知实验 · 课程作业（W5 找不同 + W8 你在这里）</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='15' fill='%230D2B5C'/><circle cx='50' cy='50' r='22' fill='none' stroke='%23C8A44A' stroke-width='8'/><circle cx='50' cy='50' r='8' fill='%23C8A44A'/></svg>">
<style>
/* ============ 基础样式（源自 css/lab.css，构建时内联） ============ */
{{LAB_CSS}}

/* ============ 单文件版页面样式 ============ */
body { background: #eef1f6; color: var(--text); }
.view { display: none; }
.view.active { display: block; }

.topbar { background: var(--navy); color: #fff; padding: 10px 22px; display: flex; align-items: center; gap: 12px; }
.topbar .dot { width: 26px; height: 26px; border-radius: 50%; border: 6px solid var(--gold); flex: none; }
.topbar b { font-family: var(--serif); font-size: 17px; white-space: nowrap; }

.wrap { max-width: 940px; margin: 0 auto; padding: 10px 18px 40px; }
.step { display: flex; gap: 12px; align-items: flex-start; margin: 10px 0; font-size: 14px; }
.step i { flex: 0 0 24px; height: 24px; border-radius: 50%; background: var(--gold); color: #fff; font-style: normal; font-weight: 700; font-size: 13px; display: flex; align-items: center; justify-content: center; }
.row { display: flex; gap: 12px; flex-wrap: wrap; align-items: center; }
.err { color: #c62828; font-size: 13px; min-height: 18px; }
.hint { background: #fffbeb; border-left: 4px solid var(--gold); border-radius: 0 8px 8px 0; padding: 10px 14px; font-size: 13px; line-height: 1.7; color: #6b5a2a; margin: 12px 0 0; }
#screen-final .thanks { text-align: center; padding: 46px 24px; }
#screen-final .thanks h2 { margin-bottom: 10px; }
#screen-final .thanks p { font-size: 16px; color: #44506a; }

/* ---- 结果视图 ---- */
.res-wrap { max-width: 1000px; padding: 20px 18px 60px; }
.res-bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 6px; }
#view-results h1 { font-family: var(--serif); color: var(--navy); font-size: 26px; margin-bottom: 6px; }
#view-results h2 { font-family: var(--serif); color: var(--navy); font-size: 20px; margin: 26px 0 10px; }
#view-results p.lead { font-size: 14px; color: #44506a; line-height: 1.8; }
#view-results code { background: #f2f5fa; padding: 1px 6px; border-radius: 4px; font-family: var(--mono); font-size: 13px; }
#view-results .card { background: #fff; border-radius: 14px; padding: 18px 20px; box-shadow: 0 3px 18px rgba(13,43,92,.07); margin: 12px 0; }
#view-results table { width: 100%; border-collapse: collapse; font-size: 14px; }
#view-results th, #view-results td { padding: 8px 10px; border-bottom: 1px solid #e6eaf1; text-align: right; }
#view-results th:first-child, #view-results td:first-child { text-align: left; }
#view-results th { color: var(--muted); font-weight: 600; font-size: 13px; }
#view-results .bar { height: 10px; border-radius: 6px; background: #e8edf5; overflow: hidden; }
#view-results .bar i { display: block; height: 100%; background: var(--gold); }
#view-results .note { background: none; border: none; border-radius: 0; padding: 0; margin: 8px 0; font-size: 12.5px; color: var(--muted); line-height: 1.7; }
#view-results .pill { display: inline-block; background: #f2f5fa; border-radius: 20px; padding: 2px 10px; font-size: 12px; color: var(--navy); margin-right: 6px; }
#view-results .warn { background: #fff6f4; border-left: 4px solid #c62828; padding: 10px 14px; border-radius: 8px; font-size: 14px; }

@media (max-width: 720px) {
  .topbar { flex-wrap: wrap; padding: 10px 14px; }
  .consent { padding: 22px 18px; }
}
</style>
</head>
<body>

<header class="topbar">
  <span class="dot"></span>
  <b>注意与空间认知实验</b>
</header>

<main>
  <!-- ==================== 视图一：实验 ==================== -->
  <section class="view active" id="view-lab">
    <div class="wrap">

      <!-- 1. 登录 -->
      <section class="screen active" id="screen-login">
        <div class="login-box">
          <h2>被试信息</h2>
          <div class="field"><label>被试编号</label><input id="in-sid" autocomplete="off" placeholder="例如 P01"></div>
          <div class="field"><label>姓名</label><input id="in-name" autocomplete="off" placeholder="仅本地记录"></div>
          <div class="err" id="login-err"></div>
          <div class="row" style="margin-top:6px">
            <button class="btn btn-gold" id="btn-login">进入实验</button>
          </div>
        </div>
      </section>

      <!-- 2. 结束 -->
      <section class="screen" id="screen-final">
        <div class="consent thanks">
          <h2>实验结束</h2>
          <p>感谢你的参与！</p>
        </div>
      </section>

    </div>
  </section>

  <!-- ==================== 视图二：全班结果 ==================== -->
  <section class="view" id="view-results">
    <div class="wrap res-wrap">
      <div class="res-bar">
        <span class="muted">数据来自课程服务器 /api/hw2/data（匿名，需联网）</span>
        <button type="button" class="btn btn-o btn-sm" id="btn-results-refresh">刷新数据</button>
      </div>
      {{RESULTS}}
    </div>
  </section>
</main>

<script>
{{JS}}
</script>
</body>
</html>
